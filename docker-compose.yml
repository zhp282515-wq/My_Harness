services:
  postgres:
    image: postgres:16
    container_name: harness-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-my_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-my_harness}
    ports:
      - "5433:5432"
    volumes:
      - harness_pgdata:/var/lib/postgresql/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: harness-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: harness-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: harness-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
  attu:
    image: zilliz/attu:v2.5
    container_name: harness-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8001:3000"        # ← 用 8001，避开以后 FastAPI 要用的 8000
    depends_on:
      - milvus

volumes:
  harness_pgdata:
  milvus_etcd:
  milvus_minio:
  milvus_data:
